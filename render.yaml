services:
  # Backend Web Service
  - type: web
    name: saathi-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false  # Must configure in Render dashboard (connection string)
      - key: GEMINI_API_KEY
        sync: false  # Must configure in Render dashboard (your Gemini API key)
      - key: FRONTEND_URL
        value: https://saathi-frontend.onrender.com  # URL of the frontend static site

  # Frontend Static Site
  - type: web
    name: saathi-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Proxy all API requests to the FastAPI backend service
      - type: rewrite
        source: /api/*
        destination: https://saathi-backend.onrender.com/api/*
      # SPA Routing fallback: redirect all other paths to index.html
      - type: rewrite
        source: /*
        destination: /index.html
